# Valida el visor y el modelo y, si todo pasa, publica el visor web (carpeta web/) en GitHub Pages.
# Hasta el 23-10-2026 este flujo solo desplegaba, sin validar nada (auditoría C10).
name: Validar y publicar el visor

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "web/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Contrato del GLB, coherencia con el manifiesto, visor sin CDN, dependencias en web/vendor/ y sintaxis.
      - name: Comprobar el modelo y el visor
        run: node tools/check.mjs
      # Validador oficial de Khronos: el GLB no puede tener errores.
      - name: Validar el GLB (Khronos)
        run: |
          npm i --no-save --no-audit --no-fund gltf-validator@2.0.0-dev.3.10 playwright@1.56.1
          node tools/validate_glb.mjs
      # Prueba de humo en Chromium: carga con gzip, sin CDN, explosión reversible, dibujo bajo demanda y aperturas.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ runner.os }}
      - name: Prueba de humo del visor
        run: |
          npx playwright install --with-deps chromium
          node tools/smoke.mjs

  deploy:
    # Solo desde main y solo si la validación pasa.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validar
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar el visor
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
